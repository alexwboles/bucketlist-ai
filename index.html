<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BucketList AI — dream it, plan it, do it</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">BucketList AI</h1>
    <p class="tagline">Collect your dreams, plan the adventure, log the memory.</p>
  </div>
</header>

<main class="wrap">
  <section id="dreamHead" class="card"></section>

  <nav class="tabs">
    <button id="tabbtn-mine" class="active" data-tab="mine">My bucket list</button>
    <button id="tabbtn-ideas" data-tab="ideas">Idea bank</button>
    <button id="resetAll" class="danger ghost right">Start over</button>
  </nav>

  <section id="tab-mine"></section>
  <section id="tab-ideas" class="hidden"></section>
</main>

<footer class="foot">
  <p>100% local — your dreams never leave this browser. No account, no API keys.</p>
</footer>

<script src="js/ideabank.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
